name: Deploy Job Dashboard

on:
  schedule:
    - cron: '0 7 * * *' # Läuft täglich morgens
  workflow_dispatch: # Erlaubt manuellen Start per Klick

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install python-jobspy pandas

      - name: HTML Dashboard bauen
        run: python main.py

      - name: Auf GitHub Pages veröffentlichen
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          destination_dir: ./
